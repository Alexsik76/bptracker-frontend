<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Notification Diagnostics - BP Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: rgba(22, 22, 28, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f3f7;
            --text-secondary: #a0a0b0;
            --accent-purple: #9b5de5;
            --accent-purple-hover: #b07bf0;
            --accent-green: #06d6a0;
            --accent-red: #ff5d73;
            --accent-danger-hover: #ff7588;
            --glass-blur: blur(16px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
            line-height: 1.5;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(155, 93, 229, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 214, 160, 0.03) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff 30%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        h1::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 24px;
            background: var(--accent-purple);
            border-radius: 4px;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
        }

        button {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--accent-purple);
            color: #fff;
            border-color: transparent;
        }

        .btn-primary:hover {
            background-color: var(--accent-purple-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(155, 93, 229, 0.2);
        }

        .btn-danger {
            background-color: transparent;
            color: var(--accent-red);
            border-color: rgba(255, 93, 115, 0.2);
        }

        .btn-danger:hover {
            background-color: rgba(255, 93, 115, 0.1);
            border-color: var(--accent-red);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .error-bar {
            background-color: rgba(255, 93, 115, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            stroke: var(--text-secondary);
            opacity: 0.5;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            color: var(--text-secondary);
            font-weight: 500;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.015);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background-color: rgba(6, 214, 160, 0.1);
            color: var(--accent-green);
        }

        .badge-fail {
            background-color: rgba(255, 93, 115, 0.1);
            color: var(--accent-red);
        }

        .text-error {
            color: var(--accent-red);
            font-family: monospace;
            font-size: 0.8rem;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .raw-text {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            max-width: 350px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .raw-text:hover {
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            body {
                padding: 1.5rem 1rem;
            }
            header {
                flex-direction: column;
                align-items: flex-start;
            }
            .actions {
                width: 100%;
            }
            .actions button {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Push Diagnostics Log</h1>
            <div class="actions">
                <button class="btn-danger" id="btnClear" onclick="clearLogs()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                    Clear log
                </button>
                <button class="btn-primary" id="btnRefresh" onclick="loadLogs()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H18.5"/>
                    </svg>
                    Refresh
                </button>
            </div>
        </header>

        <div class="error-bar" id="error-bar"></div>

        <div class="card">
            <div id="empty-message" class="empty-state">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                </svg>
                <p>No push events logged yet.</p>
            </div>

            <div id="table-container" class="table-responsive" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Received At</th>
                            <th>Has Data</th>
                            <th>Parsed Ok</th>
                            <th>Shown</th>
                            <th>Title</th>
                            <th>Error</th>
                            <th>Raw Payload (Hover for Full)</th>
                        </tr>
                    </thead>
                    <tbody id="log-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const DB_NAME = "push-debug";
        const STORE_NAME = "events";

        function openDb() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = event => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
                    }
                };
                request.onsuccess = event => {
                    resolve(event.target.result);
                };
                request.onerror = event => {
                    reject(request.error || new Error("Failed to open database"));
                };
            });
        }

        async function loadLogs() {
            const tableBody = document.getElementById("log-body");
            const emptyMsg = document.getElementById("empty-message");
            const tableContainer = document.getElementById("table-container");

            tableBody.innerHTML = "";

            try {
                const db = await openDb();
                const transaction = db.transaction([STORE_NAME], "readonly");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();

                request.onsuccess = () => {
                    const logs = request.result;
                    db.close();

                    if (!logs || logs.length === 0) {
                        emptyMsg.style.display = "block";
                        emptyMsg.querySelector("p").textContent = "No push events logged yet.";
                        tableContainer.style.display = "none";
                        return;
                    }

                    emptyMsg.style.display = "none";
                    tableContainer.style.display = "block";

                    // Sort descending by receivedEpochMs
                    logs.sort((a, b) => b.receivedEpochMs - a.receivedEpochMs);

                    logs.forEach(log => {
                        const tr = document.createElement("tr");

                        // ID
                        const tdId = document.createElement("td");
                        tdId.textContent = log.id;
                        tr.appendChild(tdId);

                        // Received At
                        const tdTime = document.createElement("td");
                        try {
                            const d = new Date(log.receivedAt);
                            tdTime.textContent = d.toLocaleString();
                        } catch {
                            tdTime.textContent = log.receivedAt || "-";
                        }
                        tr.appendChild(tdTime);

                        // Has Data
                        const tdHasData = document.createElement("td");
                        tdHasData.appendChild(createBadge(log.hasData));
                        tr.appendChild(tdHasData);

                        // Parsed Ok
                        const tdParsed = document.createElement("td");
                        tdParsed.appendChild(createBadge(log.parsedOk));
                        tr.appendChild(tdParsed);

                        // Shown
                        const tdShown = document.createElement("td");
                        tdShown.appendChild(createBadge(log.shown));
                        tr.appendChild(tdShown);

                        // Title
                        const tdTitle = document.createElement("td");
                        tdTitle.textContent = log.title || "-";
                        tr.appendChild(tdTitle);

                        // Error
                        const tdError = document.createElement("td");
                        if (log.error) {
                            tdError.textContent = log.error;
                            tdError.title = log.error;
                            tdError.classList.add("text-error");
                        } else {
                            tdError.textContent = "-";
                        }
                        tr.appendChild(tdError);

                        // Raw Text
                        const tdRaw = document.createElement("td");
                        if (log.rawText) {
                            const maxLen = 120;
                            tdRaw.textContent = log.rawText.length > maxLen ? log.rawText.substring(0, maxLen) + "..." : log.rawText;
                            tdRaw.title = log.rawText;
                            tdRaw.classList.add("raw-text");
                            tdRaw.style.cursor = "help";
                        } else {
                            tdRaw.textContent = "-";
                        }
                        tr.appendChild(tdRaw);

                        tableBody.appendChild(tr);
                    });
                };

                request.onerror = () => {
                    db.close();
                    showError("Failed to fetch diagnostic entries from IndexedDB.");
                };
            } catch (err) {
                console.error(err);
                emptyMsg.style.display = "block";
                emptyMsg.querySelector("p").textContent = "No push events logged yet (IndexedDB not initialized).";
                tableContainer.style.display = "none";
            }
        }

        function createBadge(status) {
            const span = document.createElement("span");
            span.classList.add("badge");
            if (status === true) {
                span.textContent = "Yes";
                span.classList.add("badge-success");
            } else if (status === false) {
                span.textContent = "No";
                span.classList.add("badge-fail");
            } else {
                span.textContent = "-";
            }
            return span;
        }

        function showError(msg) {
            const errorBar = document.getElementById("error-bar");
            errorBar.textContent = msg;
            errorBar.style.display = "block";
            setTimeout(() => {
                errorBar.style.display = "none";
            }, 6000);
        }

        async function clearLogs() {
            if (!confirm("Are you sure you want to clear all logged push events?")) {
                return;
            }

            try {
                const db = await openDb();
                const transaction = db.transaction([STORE_NAME], "readwrite");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.clear();

                request.onsuccess = () => {
                    db.close();
                    loadLogs();
                };

                request.onerror = () => {
                    db.close();
                    showError("Failed to clear IndexedDB events store.");
                };
            } catch (err) {
                showError("Database error: " + err.message);
            }
        }

        // Initial load
        window.addEventListener("DOMContentLoaded", loadLogs);
    </script>
</body>
</html>
